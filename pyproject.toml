[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "titan-omnimacro"
version = "2.0.0"
description = "Institutional Multi-Asset Quantitative Trajectory Forecasting, Term Structure Modeling & Swensen Rebalancing Engine"
authors = [{ name = "Guillaume Bayona" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "yfinance>=0.2.30",
    "requests>=2.28",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "httpx>=0.25.0",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
